<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172e"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#0E6506"/>
    </linearGradient>
  </defs>

  <!-- Deep Navy Rounded Base with Gold Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Indian Tricolor Arc Top (Saffron) -->
  <path d="M 12 32 A 20 20 0 0 1 52 32" fill="none" stroke="url(#saffronGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Indian Tricolor Arc Bottom (Green) -->
  <path d="M 52 32 A 20 20 0 0 1 12 32" fill="none" stroke="url(#greenGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Central Disc -->
  <circle cx="32" cy="32" r="14.5" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Ashoka Chakra Spokes -->
  <g stroke="#000088" stroke-width="1">
    <line x1="32" y1="18.5" x2="32" y2="45.5"/>
    <line x1="18.5" y1="32" x2="45.5" y2="32"/>
    <line x1="22.5" y1="22.5" x2="41.5" y2="41.5"/>
    <line x1="22.5" y1="41.5" x2="41.5" y2="22.5"/>
    <line x1="26.5" y1="19.5" x2="37.5" y2="44.5"/>
    <line x1="37.5" y1="19.5" x2="26.5" y2="44.5"/>
    <line x1="19.5" y1="26.5" x2="44.5" y2="37.5"/>
    <line x1="19.5" y1="37.5" x2="44.5" y2="26.5"/>
  </g>

  <!-- Central Blue Hub & Golden Core -->
  <circle cx="32" cy="32" r="3.5" fill="#000088"/>
  <circle cx="32" cy="32" r="1.5" fill="#f59e0b"/>

  <!-- AI Sparkle Motif at Top Right -->
  <path d="M 48 10 L 49.5 13.5 L 53 15 L 49.5 16.5 L 48 20 L 46.5 16.5 L 43 15 L 46.5 13.5 Z" fill="#fbbf24"/>
</svg>